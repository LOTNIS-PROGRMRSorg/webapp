<!doctype html>
<html lang="en-GH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lotnis — Rent spaces, order food, book services &amp; organise events in Ghana</title>
    <meta
      name="description"
      content="Rent spaces today — rooms, homes, offices, garages and warehouses — with food, trusted service providers (plumbers, tour guides, photographers and more) and events coming next. One account, mobile-money payments, verified hosts across Ghana."
    />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <link rel="canonical" href="https://lotnis.com/" />
    <meta name="theme-color" content="#0e2f2b" />
    <meta name="application-name" content="Lotnis" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/og-default.jpg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- Fonts load from Google; open the connections early so text paints sooner. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Social previews and crawlers that don't run JavaScript read these defaults;
         each page then sets its own via the Seo component. -->
    <meta property="og:site_name" content="Lotnis" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GH" />
    <meta
      property="og:title"
      content="Lotnis — Rent spaces, order food, book services &amp; organise events in Ghana"
    />
    <meta
      property="og:description"
      content="Spaces, food, services and events in one place — verified providers, clear prices, mobile-money payments."
    />
    <meta property="og:url" content="https://lotnis.com/" />
    <meta property="og:image" content="https://lotnis.com/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A sunlit terracotta hallway — Lotnis, rent space in Ghana" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Lotnis — Rent spaces, order food, book services &amp; organise events in Ghana"
    />
    <meta
      name="twitter:description"
      content="Spaces, food, services and events in one place — verified providers, clear prices, mobile-money payments."
    />
    <meta name="twitter:image" content="https://lotnis.com/og-default.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://lotnis.com/#organization",
            "name": "Lotnis",
            "url": "https://lotnis.com",
            "logo": "https://lotnis.com/favicon.svg",
            "areaServed": { "@type": "Country", "name": "Ghana" }
          },
          {
            "@type": "WebSite",
            "@id": "https://lotnis.com/#website",
            "url": "https://lotnis.com",
            "name": "Lotnis",
            "inLanguage": "en-GH",
            "publisher": { "@id": "https://lotnis.com/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://lotnis.com/explore?query={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Branded shell shown only while React is loading; React replaces this on mount. -->
      <div
        aria-label="Loading Lotnis"
        role="status"
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          overflow: hidden;
          background: #f8f7f2;
          color: #173b37;
          font-family: system-ui, sans-serif;
        "
      >
        <div style="display: grid; justify-items: center; gap: 18px; padding: 24px; text-align: center">
          <div
            style="
              display: grid;
              place-items: center;
              width: 52px;
              height: 52px;
              border-radius: 16px;
              background: #173b37;
              color: #fff;
              font-size: 1.5rem;
              font-weight: 700;
              box-shadow: 0 12px 30px rgb(23 59 55 / 18%);
            "
          >
            L
          </div>
          <div>
            <strong style="display: block; font-size: 1.05rem">Lotnis</strong>
            <span style="display: block; margin-top: 5px; color: #71817d; font-size: 0.9rem"
              >Getting things ready…</span
            >
          </div>
          <span style="width: 34px; height: 4px; overflow: hidden; border-radius: 99px; background: #dce5e1">
            <span
              style="
                display: block;
                width: 55%;
                height: 100%;
                border-radius: inherit;
                background: #ed7256;
                animation: lotnis-boot 1.1s ease-in-out infinite alternate;
              "
            />
          </span>
        </div>
      </div>
    </div>
    <style>
      @keyframes lotnis-boot {
        from {
          transform: translateX(-80%);
        }
        to {
          transform: translateX(160%);
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
